<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Habitnex review draft 01</title>
<style>
  @font-face { font-family: "Onest"; font-weight: 800; src: url("../product-video/assets/onest-latin-800-normal.woff2") format("woff2"); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased; color: #fff; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  /* The phone: a capture inside a plain bezel. 780 px wide at scale 1. */
  #phone { position: absolute; left: 0; top: 0; width: 780px; height: 1696px; transform-origin: 0 0; }
  #bezel { position: absolute; inset: -12px; border-radius: 132px; background: #060607; box-shadow: 0 0 0 2px #4a4a4e, 0 0 0 5px #1b1b1d; }
  #shots { position: absolute; inset: 0; border-radius: 120px; overflow: hidden; background: #f2f2f7; }
  #shots img { position: absolute; left: 0; top: 0; width: 780px; height: 1696px; display: block; }
  #tap { position: absolute; left: 0; top: 0; width: 92px; height: 92px; margin: -46px 0 0 -46px; border-radius: 50%; background: rgba(150, 150, 158, 0.42); box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.75), 0 4px 18px rgba(0, 0, 0, 0.18); }
  /* Captions: plain white type on the black above the phone. */
  #shade { position: absolute; left: 0; top: 0; width: 1080px; height: 430px; background: linear-gradient(to bottom, #000 72%, rgba(0, 0, 0, 0)); }
  .cap { position: absolute; left: 70px; width: 940px; top: 118px; height: 236px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 66px; line-height: 1.12; font-weight: 800; letter-spacing: -0.02em; text-wrap: balance; }
  #label { position: absolute; left: 0; width: 1080px; top: 52px; height: 36px; font-size: 28px; font-weight: 600; letter-spacing: 0.01em; color: rgba(255, 255, 255, 0.6); }
  #label span { position: absolute; left: 0; width: 1080px; text-align: center; }
  #label-calendar { color: rgba(255, 255, 255, 0.85); } /* the opening calendar is a rebuilt screen, not a capture */
  /* End card */
  #end { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #lockup { display: flex; align-items: center; gap: 30px; }
  #mark { position: relative; width: 138px; height: 138px; }
  #mark div { position: absolute; }
  #word { font-family: "Onest", sans-serif; font-weight: 800; font-size: 122px; letter-spacing: -0.05em; line-height: 1; padding-bottom: 12px; }
  #join { font-size: 76px; font-weight: 800; letter-spacing: -0.02em; margin-top: 96px; }
  #site { font-size: 58px; font-weight: 600; margin-top: 22px; color: rgba(255, 255, 255, 0.78); }
</style>
</head>
<body>
<div id="stage">
  <div id="phone">
    <div id="bezel"></div>
    <div id="shots">
      <img id="s-today" src="captures/today-timeline-rebuilt.png">
      <img id="s-chat" src="captures/coach-chat.png">
      <img id="s-preview" src="captures/move-gym-preview.png">
    </div>
    <div id="tap"></div>
  </div>
  <div id="shade"></div>
  <div class="cap">Your meeting ran late.</div>
  <div class="cap">Does your workout disappear?</div>
  <div class="cap">I’m building Habitnex to help habits fit around your calendar.</div>
  <div class="cap">Talk to the coach,</div>
  <div class="cap">review the suggested change,</div>
  <div class="cap">then apply it when it works for you.</div>
  <div id="end">
    <div id="lockup"><div id="mark"><div></div><div></div><div></div></div><div id="word">habitnex</div></div>
    <div id="join">Join the waitlist</div>
    <div id="site">habitnex.io</div>
  </div>
  <div id="label"><span id="label-demo">Demo · In development</span><span id="label-calendar">Illustrative calendar · Demo</span></div>
</div>
<script>
// Private review draft 01. Every frame is a function of time: seek(t) lays out second t.
// With ?voice=1 the timings follow the narration take (out/narration.json, from timing.mjs);
// without it the film is the silent, caption-led cut.
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const lerp = (a, b, p) => a + (b - a) * p;
const inOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const out = (x) => 1 - Math.pow(1 - x, 3);
const linear = (x) => x;
const prog = (t, start, dur, ease = inOut) => ease(clamp01((t - start) / dur));
const $ = (s) => document.querySelector(s);

/** The silent cut's timetable (seconds). `captions` are [appears, leaves] for the six lines. */
let T = {
  lead: 0,
  captions: [[0.25, 1.85], [1.95, 3.75], [3.95, 7.55], [7.75, 10.35], [10.5, 13.75], [13.9, 17.75]],
  toChat: 3.75, bubbles: 7.55, change: 10.35, tap: 12.75, sheet: 12.95, push: 14.2,
  end: 18, // the waitlist card holds from here
  duration: 21,
};

/** The voiced cut: each caption appears as its words start, and the picture moves with it. */
function follow(narration) {
  const lead = narration.lead ?? 0.4; // a breath of picture before the first word
  const p = narration.phrases.map((phrase) => phrase.start + lead);
  const end = p[6] - 0.3; // the card arrives just before "Join the waitlist…"
  const tap = p[4] + 0.6 * (p[5] - p[4]); // Preview is tapped as "review the suggested change" finishes
  T = {
    lead,
    captions: p.slice(0, 6).map((at, i) => [at - 0.05, i === 5 ? end - 0.25 : p[i + 1] - 0.34]), // each line is gone before the next arrives
    toChat: p[2] - 0.25, bubbles: p[3] - 0.3, change: p[4] - 0.2, tap, sheet: tap + 0.2, push: tap + 1.1,
    end,
    duration: Math.ceil(Math.max(end + 3, narration.speechEnd + lead + (narration.tail ?? 0.7)) * 10 - 1e-6) / 10, // at least three seconds of the card
  };
}

// Camera: `fx`, `fy` are the point of the capture being looked at (0–1), `ty` where it sits in
// the frame, `s` the zoom. Each key is approached from its time, over `dur` seconds.
const camera = () => [
  { at: 0, fx: 0.56, fy: 0.69, ty: 1160, s: 1.22 },                                    // the busy day, around noon
  { at: 0.1, fx: 0.56, fy: 0.72, ty: 1160, s: 1.34, dur: T.toChat - 0.2, ease: linear },
  { at: T.toChat, fx: 0.5, fy: 0.5, ty: 1150, s: 0.92, dur: 0.7 },                      // the Coach tab, whole screen
  { at: T.bubbles, fx: 0.5, fy: 0.53, ty: 1090, s: 1.26, dur: 0.9 },                    // the message and the reply
  { at: T.change, fx: 0.47, fy: 0.72, ty: 1120, s: 1.3, dur: 0.9 },                     // the suggested change
  { at: T.sheet + 0.05, fx: 0.5, fy: 0.72, ty: 1170, s: 1.12, dur: 0.8 },               // the preview sheet
  { at: T.push, fx: 0.5, fy: 0.68, ty: 1150, s: 1.24, dur: Math.max(1, T.end - T.push - 0.3), ease: linear },
];
const PREVIEW = { x: 0.239, y: 0.772 }; // the Preview button on the chat capture

function seek(t) {
  // Camera
  const keys = camera();
  const END = T.end, TAP = { at: T.tap, ...PREVIEW }, SHEET = T.sheet;
  let c = { ...keys[0] };
  for (const key of keys.slice(1)) {
    if (t <= key.at) break;
    const p = prog(t, key.at, key.dur, key.ease ?? inOut);
    for (const k of ["fx", "fy", "ty", "s"]) c[k] = lerp(c[k], key[k], p);
  }
  const leave = prog(t, END - 0.35, 0.45);
  const phone = $("#phone");
  phone.style.transform = `translate(${540 - c.fx * 780 * c.s}px, ${c.ty - c.fy * 1696 * c.s + 260 * leave}px) scale(${c.s})`;
  phone.style.opacity = 1 - leave;

  // Which capture is up. The day slides away as the Coach tab arrives; the sheet rises over the chat.
  const toChat = prog(t, T.toChat, 0.26);
  $("#label-calendar").style.opacity = 1 - toChat;
  $("#label-demo").style.opacity = toChat;
  $("#s-today").style.opacity = 1 - toChat;
  $("#s-chat").style.opacity = toChat;
  const sheet = prog(t, SHEET, 0.38, out);
  const preview = $("#s-preview");
  preview.style.opacity = clamp01(sheet * 3);
  preview.style.clipPath = `inset(${(1 - sheet) * 52}% 0 0 0)`; // revealed from the bottom, like the sheet
  preview.style.transform = `translateY(${(1 - sheet) * 60}px)`;

  // Tap on Preview
  const tap = $("#tap");
  const land = prog(t, TAP.at - 0.32, 0.26, out);
  const lift = prog(t, TAP.at + 0.14, 0.26);
  tap.style.opacity = t > TAP.at - 0.32 && t < TAP.at + 0.42 ? land * (1 - lift) : 0;
  tap.style.transform = `translate(${TAP.x * 780}px, ${TAP.y * 1696}px) scale(${lerp(1.6, 1, land) * (1 - 0.18 * (prog(t, TAP.at - 0.03, 0.08) - prog(t, TAP.at + 0.1, 0.15)))})`;

  // Captions
  document.querySelectorAll(".cap").forEach((cap, i) => {
    const [from, to] = T.captions[i];
    const enter = prog(t, from, 0.3, out), exit = prog(t, to, 0.22);
    cap.style.opacity = enter * (1 - exit);
    cap.style.transform = `translateY(${(1 - enter) * 22 - exit * 14}px)`;
  });

  // End card
  const end = $("#end");
  end.style.display = t < END - 0.1 ? "none" : "";
  const e = (delay) => prog(t, END + delay, 0.5, out);
  $("#lockup").style.opacity = e(0.05);
  $("#lockup").style.transform = `translateY(${(1 - e(0.05)) * 26}px)`;
  $("#join").style.opacity = e(0.3);
  $("#join").style.transform = `translateY(${(1 - e(0.3)) * 26}px)`;
  $("#site").style.opacity = e(0.5);
  $("#site").style.transform = `translateY(${(1 - e(0.5)) * 26}px)`;
}

// The Slot mark (30 × 30 unit box, brand/README.md), on black.
const U = 138 / 30;
[[0, 0, 22, 7, "#48484a"], [8, 10, 22, 10, "#fff"], [0, 23, 22, 7, "#48484a"]].forEach(([x, y, w, h, color], i) => {
  Object.assign(document.querySelectorAll("#mark div")[i].style, { left: x * U + "px", top: y * U + "px", width: w * U + "px", height: h * U + "px", borderRadius: 2.5 * U + "px", background: color });
});
const voiced = new URLSearchParams(location.search).get("voice") === "1";
const timing = new URLSearchParams(location.search).get("timing") ?? "out/narration.json";
Promise.all([voiced ? fetch(timing).then((r) => r.json()).then(follow) : null, document.fonts.load('800 100px "Onest"', "habitnex"), ...[...document.images].map((img) => img.decode())]).then(() => {
  window.DURATION = T.duration;
  window.LEAD = T.lead;
  window.TIMES = T;
  window.seek = seek;
  seek(Number(new URLSearchParams(location.search).get("t") ?? 0));
  window.READY = true;
});
</script>
</body>
</html>
