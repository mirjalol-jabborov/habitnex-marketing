<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Habitnex story draft 03 · Perfect reminder. Impossible timing.</title>
<style>
  @font-face { font-family: "Onest"; font-weight: 800; src: url("../product-video/assets/onest-latin-800-normal.woff2") format("woff2"); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #C6E8FF; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased; color: #15171C; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #C6E8FF; }
  #art { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  #art text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; text-anchor: middle; }
  /* The real app captures, inside a plain bezel. */
  #phone { position: absolute; left: 0; top: 0; width: 780px; height: 1696px; transform-origin: 0 0; }
  #bezel { position: absolute; inset: -12px; border-radius: 132px; background: #060607; box-shadow: 0 0 0 2px #4a4a4e, 0 0 0 5px #1b1b1d; }
  #shots { position: absolute; inset: 0; border-radius: 120px; overflow: hidden; background: #f2f2f7; }
  #shots img { position: absolute; left: 0; top: 0; width: 780px; height: 1696px; display: block; }
  #focus { position: absolute; border-radius: 30px; pointer-events: none; } /* emphasis drawn by the film, not the app */
  #shade { position: absolute; left: 0; top: 0; width: 1080px; height: 430px; background: linear-gradient(to bottom, #C6E8FF 372px, rgba(198, 232, 255, 0) 412px); }
  .cap { position: absolute; left: 60px; width: 960px; top: 112px; height: 240px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 70px; line-height: 1.1; font-weight: 800; letter-spacing: -0.02em; text-wrap: balance; }
  .cap.long { font-size: 60px; }
  #end { position: absolute; left: 0; top: 400px; width: 1080px; display: flex; flex-direction: column; align-items: center; }
  #lockup { display: flex; align-items: center; gap: 28px; }
  #tile { position: relative; width: 132px; height: 132px; border-radius: 30px; background: #000; }
  #tile div { position: absolute; }
  #word { font-family: "Onest", sans-serif; font-weight: 800; font-size: 122px; letter-spacing: -0.05em; line-height: 1; padding-bottom: 12px; }
  #dev { font-size: 44px; font-weight: 700; margin-top: 26px; padding: 12px 30px; border-radius: 40px; background: rgba(21, 23, 28, 0.1); }
  #join { font-size: 78px; font-weight: 800; letter-spacing: -0.02em; margin-top: 56px; }
  #site { font-size: 92px; font-weight: 800; letter-spacing: -0.02em; margin-top: 20px; }
  /* The day as a tilted board: an illustration of the same events the real screens show. */
  #cal3d { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; perspective: 1900px; perspective-origin: 42% 50%; }
  #board { position: absolute; left: 150px; top: 360px; width: 640px; height: 880px; transform-style: preserve-3d; }
  #board > div { position: absolute; }
  .b-shadow { inset: 30px -10px -30px 30px; border-radius: 40px; background: rgba(21, 23, 28, 0.2); filter: blur(22px); transform: translateZ(-60px); }
  .b-card { inset: 0; border-radius: 34px; background: #fff; }
  .b-head { left: 0; top: 0; width: 640px; height: 74px; border-radius: 34px 34px 0 0; background: #FFD23F; font-size: 32px; font-weight: 800; line-height: 74px; padding-left: 34px; }
  .b-hour { left: 22px; width: 596px; height: 0; border-top: 3px solid rgba(21, 23, 28, 0.1); font-size: 23px; font-weight: 700; color: rgba(21, 23, 28, 0.5); line-height: 30px; }
  .b-block { left: 118px; width: 500px; border-radius: 16px; color: #fff; font-size: 31px; font-weight: 800; padding: 0 18px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 7px 0 rgba(21, 23, 28, 0.2); white-space: nowrap; }
  .b-block small { font-size: 25px; font-weight: 700; opacity: 0.92; }
  .b-block.tall { align-items: flex-start; padding-top: 12px; }             /* its name sits at its start, clear of what overlaps it later */
  .b-block.short, .b-block.short small { font-size: 19px; border-radius: 8px; }
  .b-free { left: 118px; width: 500px; border-radius: 16px; border: 5px dashed rgba(21, 23, 28, 0.55); background: rgba(255, 210, 63, 0.45); color: #15171C; font-size: 34px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .b-free.quiet { border-color: rgba(21, 23, 28, 0.3); background: rgba(255, 210, 63, 0.16); }
  .b-scan { left: 100px; width: 530px; height: 6px; border-radius: 3px; background: #15171C; }
  .b-scan::before { content: ""; position: absolute; left: -8px; top: -8px; width: 22px; height: 22px; border-radius: 50%; background: #15171C; }
</style>
</head>
<body>
<div id="stage">
  <svg id="art" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="cal3d"><div id="board"></div></div>
  <div id="phone">
    <div id="bezel"></div>
    <div id="shots">
      <img id="s-today" src="../story-video-02/captures/today-fixture-real.png">
      <img id="s-chat" src="../story-video-02/captures/chat-fixture-real.png">
      <div id="focus"></div>
    </div>
  </div>
  <div id="shade"></div>
  <div id="caps"></div>
  <div id="end">
    <div id="lockup"><div id="tile"><div></div><div></div><div></div></div><div id="word">habitnex</div></div>
    <div id="dev">In development</div>
    <div id="join">Join the waitlist</div>
    <div id="site">habitnex.io</div>
  </div>
</div>
<script>
// Story draft 03: "Perfect reminder. Impossible timing." Nina (drawn here from simple shapes)
// gets a gym reminder at 18:00 while she is still in a meeting. Her day is told with an
// illustrated planner; then the real app screens show the product, and the same day comes back
// as a tilted board. Every frame is a function of time: seek(t) draws second t. The timing
// follows the narration (out/story3.json, from timing.mjs).
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const lerp = (a, b, p) => a + (b - a) * p;
const inOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const out = (x) => 1 - Math.pow(1 - x, 3);
const inn = (x) => x * x * x;
const linear = (x) => x;
const prog = (t, start, dur, ease = inOut) => ease(clamp01((t - start) / dur));
function spring(t, start, response = 0.5, damping = 0.7) {
  const x = t - start;
  if (x <= 0) return 0;
  const w0 = (2 * Math.PI) / response, wd = w0 * Math.sqrt(1 - damping * damping);
  return 1 - Math.exp(-damping * w0 * x) * (Math.cos(wd * x) + ((damping * w0) / wd) * Math.sin(wd * x));
}
const kick = (t, at, response = 0.35, damping = 0.45) => (t >= at ? 1 - spring(t, at, response, damping) : 0);
const blink = (u, at) => clamp01(1 - Math.abs(u - at) / 0.09);
const $ = (s) => document.querySelector(s);
const n = (x) => Number(x.toFixed(2));

const C = { ink: "#15171C", top: "#F0468C", trousers: "#27304A", skin: "#DFA075", hair: "#2A1A14", bag: "#12B5A2", bagDark: "#0C8F80", red: "#E5432E", ok: "#17A673",
  wood: "#F1CF9E", woodDark: "#DDB67F", sun: "#FFD23F", gym: "#FF6B2C", slate: "#8FA0C4", purple: "#7C5CF0", report: "#17A673", wall: "#4B35C4" };

// ---------- The one day every calendar in the film shows: Thursday 8 October 2026 ----------
const EVENTS = [["Standup", 9.5, 10, C.slate], ["Focus work", 15, 16.5, C.slate], ["Team meeting", 16.5, 19, C.purple], ["Client report", 19, 20, C.report]];
const GYM = [18, 19];                 // the time she picked: 18:00, an hour
const OPEN = [[10, 15], [20, 23]];    // the space between the events; the coach's answer names 20:00–23:00
const hh = (h) => { const m = Math.round(h * 60); return `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`; };
const span = (from, to) => `${hh(from)}–${hh(to)}`;

// ---------- Characters ----------
function arm(sx, sy, hx, hy, side, extra, shirt, skin) {
  const L = 178;
  let dx = hx - sx, dy = hy - sy, d = Math.hypot(dx, dy);
  const reach = Math.min(d, 2 * L - 2);
  if (d > reach) { dx *= reach / d; dy *= reach / d; hx = sx + dx; hy = sy + dy; d = reach; }
  const base = Math.atan2(dy, dx), bend = Math.acos(d / (2 * L));
  const a = [sx + L * Math.cos(base + bend), sy + L * Math.sin(base + bend)], b = [sx + L * Math.cos(base - bend), sy + L * Math.sin(base - bend)];
  const e = (side > 0 ? a[0] > b[0] : a[0] < b[0]) ? a : b;
  return `<polyline points="${n(sx)},${n(sy)} ${n(e[0])},${n(e[1])} ${n(hx)},${n(hy)}" fill="none" stroke="${shirt}" stroke-width="62" stroke-linecap="round" stroke-linejoin="round"/>${extra}<circle cx="${n(hx)}" cy="${n(hy)}" r="34" fill="${skin}"/>`;
}
const NINA = { shirt: C.top, hair: C.hair, skin: C.skin, style: "bun" };
const ANNA = { shirt: "#F2A72E", hair: "#7A3E1D", skin: "#F0C7A2", style: "bob" };
const OMAR = { shirt: "#3B5BDB", hair: "#1E1E24", skin: "#B97A56", style: "short" };
/** A small reminder on a phone she is holding: a white banner on a plain wallpaper. */
const smallBanner = `<rect x="-38" y="-150" width="76" height="40" rx="9" fill="#fff"/><rect x="-32" y="-143" width="14" height="14" rx="4" fill="${C.gym}"/><rect x="-13" y="-141" width="30" height="5" rx="2.5" fill="rgba(21,23,28,.35)"/><rect x="-32" y="-124" width="60" height="7" rx="3.5" fill="${C.ink}"/>`;

/**
 * A character, feet at (x, y). Hands are targets (L, R) in their own coordinates: shoulders at
 * (±112, -600), hands hang at (±150, -290), the middle of the face is (0, -790).
 * brow: -1 worried … +1 raised. mouth: -1 frown … +1 smile. talk: 0–1 opens the mouth.
 * phone: "L" or "R" hand holds one, showing `screen`. `look` sets shirt, hair, skin and hairstyle.
 */
function person({ x, y, k = 1, lean = 0, head = 0, L = [-150, -290], R = [150, -290], brow = 0, mouth = 0, talk = 0, gaze = [0, 0], shut = 0, legs = true, phone = false, screen = "", look = NINA }) {
  const { shirt, hair, skin, style } = look;
  const sad = Math.max(0, -brow), up = Math.max(0, brow);
  const eye = (ex) => `<ellipse cx="${n(ex + gaze[0])}" cy="${n(-98 + gaze[1])}" rx="10" ry="${n(10 * (1 - shut) + 1.6)}" fill="${C.ink}"/>
    <line x1="-18" y1="0" x2="18" y2="0" stroke="${hair}" stroke-width="8" stroke-linecap="round" transform="translate(${ex} ${n(-130 - 8 * up)}) rotate(${n(Math.sign(ex) * 17 * sad)})"/>`;
  const hand = phone === "L" ? L : R;
  const held = phone ? `<g transform="translate(${n(hand[0])} ${n(hand[1])}) rotate(${phone === "L" ? -7 : 7})"><rect x="-54" y="-178" width="108" height="208" rx="20" fill="${C.ink}"/><rect x="-45" y="-168" width="90" height="188" rx="11" fill="${C.wall}"/>${screen}</g>` : "";
  const behind = style === "bob" ? `<rect x="-126" y="-176" width="252" height="176" rx="64" fill="${hair}"/>` : style === "bun" ? `<circle cx="0" cy="-224" r="50" fill="${hair}"/><rect x="-121" y="-170" width="242" height="150" rx="62" fill="${hair}"/>` : "";
  const cap = style === "bun" ? "M -108 -112 A 108 108 0 0 1 108 -112 Q 84 -162 34 -172 Q -30 -152 -108 -110 Z" : "M -108 -112 A 108 108 0 0 1 108 -112 Q 60 -152 0 -142 Q -62 -132 -108 -112 Z";
  return `<g transform="translate(${n(x)} ${n(y)}) scale(${n(k)})">
    ${legs ? `<rect x="-118" y="-310" width="102" height="300" rx="30" fill="${C.trousers}"/><rect x="16" y="-310" width="102" height="300" rx="30" fill="${C.trousers}"/>
      <rect x="-134" y="-36" width="128" height="44" rx="20" fill="${C.ink}"/><rect x="10" y="-36" width="128" height="44" rx="20" fill="${C.ink}"/>` : ""}
    <g transform="rotate(${n(lean)} 0 -330)">
      <rect x="-125" y="-352" width="250" height="80" rx="24" fill="${C.trousers}"/>
      <rect x="-27" y="-715" width="54" height="90" fill="${skin}"/>
      <rect x="-125" y="-640" width="250" height="322" rx="58" fill="${shirt}"/>
      <path d="M -46 -641 L 0 -590 L 46 -641 Z" fill="${style === "bun" ? skin : "#fff"}"/>
      <g transform="translate(0 -690) rotate(${n(head)})">
        ${behind}
        <circle cx="-108" cy="-95" r="18" fill="${skin}"/><circle cx="108" cy="-95" r="18" fill="${skin}"/>
        ${style === "bun" ? `<circle cx="-112" cy="-68" r="9" fill="${C.sun}"/><circle cx="112" cy="-68" r="9" fill="${C.sun}"/>` : ""}
        <circle cx="0" cy="-100" r="108" fill="${skin}"/>
        <path d="${cap}" fill="${hair}"/>
        ${eye(-38)}${eye(38)}
        ${talk > 0.02 ? `<ellipse cx="0" cy="-44" rx="17" ry="${n(3 + 11 * talk)}" fill="${C.ink}"/>` : `<path d="M -26 -50 Q 0 ${n(-50 + 24 * mouth)} 26 -50" fill="none" stroke="${C.ink}" stroke-width="8" stroke-linecap="round"/>`}
      </g>
      ${arm(-112, -600, L[0], L[1], -1, phone === "L" ? held : "", shirt, skin)}
      ${arm(112, -600, R[0], R[1], 1, phone && phone !== "L" ? held : "", shirt, skin)}
    </g>
  </g>`;
}
const bust = (view, o) => person({ x: 540, y: lerp(2620, 2575, view), k: lerp(1.5, 1.15, view), ...o }); // head and shoulders under the planner; smaller when the planner shows the whole day

// ---------- Props ----------
function bag({ x, y, k = 1, rot = 0, sx = 1, sy = 1 }) {
  return `<g transform="translate(${n(x)} ${n(y)}) rotate(${n(rot)}) scale(${n(k * sx)} ${n(k * sy)})">
    <path d="M -92 -182 Q 0 -300 92 -182" fill="none" stroke="${C.ink}" stroke-width="18" stroke-linecap="round"/>
    <rect x="-190" y="-195" width="380" height="195" rx="62" fill="${C.bag}"/>
    <path d="M -190 -62 H 190 a 62 62 0 0 1 -62 62 H -128 a 62 62 0 0 1 -62 -62 Z" fill="${C.bagDark}"/>
    <rect x="-140" y="-118" width="74" height="16" rx="8" fill="#fff" opacity=".9"/>
    <line x1="-120" y1="-158" x2="120" y2="-158" stroke="${C.ink}" stroke-width="9" stroke-linecap="round" stroke-dasharray="2 14"/>
    <circle cx="120" cy="-158" r="13" fill="#fff" stroke="${C.ink}" stroke-width="5"/>
  </g>`;
}
function clock({ x, y, r, minutes, pop = 1, late = 0 }) {
  const hand = (deg, length, width) => `<line x1="0" y1="0" x2="0" y2="${-length}" stroke="${C.ink}" stroke-width="${width}" stroke-linecap="round" transform="rotate(${n(deg)})"/>`;
  return `<g transform="translate(${x} ${y}) scale(${n(pop)})"><circle r="${r}" fill="#fff" stroke="${late > 0.5 ? C.red : C.ink}" stroke-width="${r * 0.11}"/>
    ${[0, 90, 180, 270].map((d) => `<line x1="0" y1="${-r * 0.78}" x2="0" y2="${-r * 0.66}" stroke="${C.ink}" stroke-width="${r * 0.06}" stroke-linecap="round" transform="rotate(${d})"/>`).join("")}
    ${hand((minutes / 720) * 360, r * 0.42, r * 0.1)}${hand((minutes % 60) * 6, r * 0.64, r * 0.07)}<circle r="${r * 0.07}" fill="${C.ink}"/></g>`;
}
/** A window: the sky goes from afternoon to dusk to night as `late` goes 0 → 1. */
function windowPane({ x, y, w, h, late }) {
  const mix = (a, b, p) => `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], p))).join(",")})`;
  const sky = late < 0.5 ? mix([174, 221, 255], [246, 160, 110], late * 2) : mix([246, 160, 110], [46, 52, 92], (late - 0.5) * 2);
  return `<g><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="22" fill="${sky}"/>
    <clipPath id="pane"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="22"/></clipPath>
    <circle cx="${x + w * 0.68}" cy="${n(y + h * (0.3 + 0.95 * late))}" r="${w * 0.14}" fill="#FFE27A" clip-path="url(#pane)"/>
    <circle cx="${x + w * 0.27}" cy="${y + h * 0.27}" r="${w * 0.085}" fill="#FDF6D8" opacity="${n(clamp01((late - 0.8) * 5))}"/><circle cx="${x + w * 0.77}" cy="${y + h * 0.2}" r="5" fill="#FDF6D8" opacity="${n(clamp01((late - 0.8) * 5))}"/><circle cx="${x + w * 0.66}" cy="${y + h * 0.5}" r="4" fill="#FDF6D8" opacity="${n(clamp01((late - 0.8) * 5))}"/>
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="22" fill="none" stroke="${C.ink}" stroke-width="14"/><line x1="${x + w / 2}" y1="${y}" x2="${x + w / 2}" y2="${y + h}" stroke="${C.ink}" stroke-width="10"/></g>`;
}
const floor = (y) => `<line x1="110" y1="${y}" x2="970" y2="${y}" stroke="rgba(21,23,28,.16)" stroke-width="8" stroke-linecap="round"/>`;
const tick = (x, y, r, pop, fill = C.ok) => (pop <= 0.01 ? "" : `<g transform="translate(${x} ${y}) scale(${n(pop)})"><circle r="${r}" fill="${fill}" stroke="#fff" stroke-width="${r * 0.16}"/><path d="M ${-r * 0.42} ${r * 0.02} L ${-r * 0.1} ${r * 0.34} L ${r * 0.46} ${-r * 0.3}" fill="none" stroke="#fff" stroke-width="${r * 0.2}" stroke-linecap="round" stroke-linejoin="round"/></g>`);
const dumbbell = (x, y, k, fill = "#fff") => `<g transform="translate(${x} ${y}) scale(${k})" fill="${fill}"><rect x="-16" y="-3.5" width="32" height="7" rx="3"/><rect x="-21" y="-12" width="8" height="24" rx="3"/><rect x="13" y="-12" width="8" height="24" rx="3"/></g>`;

/** Her phone, seen from above: a plain lock screen at 18:00 and a reminder dropping in. Not the app. */
function lockPhone({ x, y, k = 1, rot = 0, banner = 1, buzz = 0 }) {
  const wave = (side, i) => `<path d="M ${side * (286 + i * 40)} ${-150 + i * -26} q ${side * 34} ${150 + i * 26} 0 ${300 + i * 52}" fill="none" stroke="${C.ink}" stroke-width="13" stroke-linecap="round" opacity="${n(buzz * (0.7 - i * 0.28))}"/>`;
  return `<g transform="translate(${n(x)} ${n(y)}) rotate(${n(rot)}) scale(${n(k)})">
    ${wave(1, 0)}${wave(1, 1)}${wave(-1, 0)}${wave(-1, 1)}
    <rect x="-238" y="-489" width="500" height="1010" rx="84" fill="rgba(21,23,28,.2)"/>
    <rect x="-250" y="-505" width="500" height="1010" rx="84" fill="${C.ink}"/>
    <clipPath id="lock"><rect x="-230" y="-485" width="460" height="970" rx="66"/></clipPath>
    <g clip-path="url(#lock)">
      <rect x="-230" y="-485" width="460" height="970" fill="${C.wall}"/>
      <circle cx="180" cy="350" r="270" fill="#6A52E0"/><circle cx="-200" cy="110" r="150" fill="#5A43D2"/>
      <rect x="-62" y="-462" width="124" height="36" rx="18" fill="${C.ink}"/>
      <text x="0" y="-336" font-size="38" font-weight="600" fill="rgba(255,255,255,.88)">Thursday 8 October</text>
      <text x="0" y="-186" font-size="150" font-weight="800" fill="#fff" style="letter-spacing:-0.02em">18:00</text>
      <g transform="translate(0 ${n(-440 * (1 - banner))})">
        <rect x="-208" y="-118" width="416" height="184" rx="40" fill="#fff"/>
        <rect x="-184" y="-96" width="46" height="46" rx="13" fill="${C.gym}"/>${dumbbell(-161, -73, 0.9)}
        <text x="-124" y="-63" font-size="25" font-weight="700" fill="rgba(21,23,28,.55)" style="text-anchor:start;letter-spacing:.04em">REMINDER</text>
        <text x="184" y="-63" font-size="25" font-weight="600" fill="rgba(21,23,28,.45)" style="text-anchor:end">now</text>
        <text x="-184" y="-4" font-size="43" font-weight="800" fill="${C.ink}" style="text-anchor:start">Time for the gym</text>
        <text x="-184" y="38" font-size="28" font-weight="600" fill="rgba(21,23,28,.55)" style="text-anchor:start">Gym · 18:00</text>
      </g>
    </g>
  </g>`;
}

// ---------- The illustrated planner: her Thursday (drawn to look nothing like the app) ----------
/**
 * `view`: 0 is close on the afternoon and evening, 1 is the whole day, 09:00–23:00.
 * `drop`: how far each of the four events has come down into place (0–1).
 * `gym`: { pop, squeeze (0 full width … 1 squeezed beside the meeting), fade, shake, clash }.
 * `open`: how far each stretch of open time is marked (0–1). `scan`: the hour a line across the day is at.
 */
function planner({ view = 1, pop = 1, drop = [1, 1, 1, 1], gym = null, open = [0, 0], glow = 0, scan = null }) {
  const pph = lerp(88, 64, view), h0 = lerp(14.55, 9, view), Y = (h) => 510 + (h - h0) * pph, f = lerp(40, 34, view), bottom = lerp(1216, 1440, view); // the whole day needs a taller card
  const block = (from, to, fill, name, { x0 = 216, small = span(from, to), attrs = "" } = {}) => {
    const y = Y(from) + 3, h = (to - from) * pph - 6, size = Math.min(f, h * 0.8), row = Math.min(h, pph - 6);
    return `<g ${attrs}><rect x="${n(x0)}" y="${n(y)}" width="${n(960 - x0)}" height="${n(h)}" rx="${n(Math.min(18, h / 2.6))}" fill="${fill}"/>
      <text x="${n(x0 + 22)}" y="${n(y + row / 2 + size * 0.35)}" font-size="${n(size)}" font-weight="800" fill="#fff" style="text-anchor:start">${name}</text>
      <text x="940" y="${n(y + row / 2 + size * 0.3)}" font-size="${n(size * 0.8)}" font-weight="700" fill="rgba(255,255,255,.94)" style="text-anchor:end">${small}</text></g>`;
  };
  const hours = Array.from({ length: 15 }, (_, i) => 9 + i).filter((h) => Y(h) > 470 && Y(h) < bottom + 14)

    { at: 0, fx: 0.34, fy: 0.12, cx: 540, ty: 1050, s: 2.0 },                                   // "Thu, 8 Oct · 4 events · 3h free"
    { at: T.toPhone + 0.4, fx: 0.34, fy: 0.12, cx: 540, ty: 1050, s: 2.06, dur: Math.max(0.3, T.wider - T.toPhone - 0.45), ease: linear },
    { at: T.wider, fx: 0.5, fy: 0.49, cx: 540, ty: 1167, s: 1.4, dur: 0.001 },                   // the week and the coach's card from her calendar
    { at: T.wider + 0.3, fx: 0.5, fy: 0.6, cx: 540, ty: 1036, s: 1.32, dur: Math.max(0.9, T.toChat - T.wider - 0.75) },   // down her day, to the first event
    { at: T.toChat, fx: 0.5, fy: 0.7, cx: 540, ty: 1000, s: 1.4, dur: 0.36 },                    // the Coach tab arrives framed on the question and the answer
    { at: T.reply, fx: 0.5, fy: 0.725, cx: 540, ty: 1000, s: 1.46, dur: Math.max(1, T.cal3d - T.reply - 0.3), ease: linear },
  ];
  // Emphasis box: [left, top, right, bottom] of the capture (0–1) and how far the rest is dimmed.
  const off = (at, dur = 0.12) => ({ at, box: null, dim: 0, dur });
  FOCUS = [
    { at: 0, box: [0.02, 0.075, 0.67, 0.156], dim: 0 },
    { at: T.toPhone + 0.45, box: [0.02, 0.075, 0.67, 0.156], dim: 0.3, dur: 0.35 },   // the date, the events seen, the free hours
    off(T.wider - 0.08, 0.06),
    { at: T.wider + 0.95, box: [0.04, 0.518, 0.96, 0.9], dim: 0.26, dur: 0.4 },       // her day
    off(T.toChat - 0.14),
    { at: T.message, box: [0.2, 0.62, 0.975, 0.68], dim: 0.3, dur: 0.35 },            // what was asked
    { at: T.reply, box: [0.03, 0.685, 0.8, 0.815], dim: 0.36, dur: 0.4 },             // what the coach answered
    off(T.cal3d - 0.3, 0.2),
  ];
}

function seek(t) {
  // The illustrated scenes
  const art = $("#art");
  const scenes = [[0, (u) => sceneRing(u, T.meet)], [T.meet, (u) => sceneMeet(u, T.p[3] - T.meet)], [T.clash, (u) => scenePlan(u, T.p[5] - T.clash, T.p[6] - T.clash)],
    [T.evening, (u) => sceneEvening(u, T.p[8] - T.evening)], [T.scan, sceneScan], [T.idea, sceneIdea]];
  if (t >= T.cal3d - 0.05) { art.innerHTML = sceneBeside(t - T.cal3d + 0.05, spring(t, T.end - 0.1, 0.55, 0.8)); art.style.opacity = 1; }
  else if (t < T.toPhone + 0.24) {
    const [start, draw] = [...scenes].reverse().find(([at]) => t >= at);
    art.innerHTML = draw(t - start);
    art.style.opacity = 1 - prog(t, T.toPhone - 0.1, 0.2); // gone before the real screen is solid, so nothing shows through it
  } else { art.innerHTML = ""; art.style.opacity = 0; }

  // The day as a board
  const cal = $("#cal3d");
  cal.style.display = t < T.cal3d - 0.05 || t > T.end + 0.4 ? "none" : "";
  if (t >= T.cal3d - 0.05) board(t - T.cal3d, prog(t, T.end - 0.3, 0.35, inn));

  // The real captures
  let c = { ...CAMERA[0] };
  for (const key of CAMERA.slice(1)) {
    if (t <= key.at) break;
    const q = prog(t, key.at, key.dur, key.ease ?? inOut);
    for (const k of ["fx", "fy", "cx", "ty", "s"]) c[k] = lerp(c[k], key[k], q);
  }
  // The real screen arrives already framed, easing in from slightly closer, and leaves to the left.
  const grow = prog(t, T.toPhone, 0.4, out), leaving = prog(t, T.cal3d - 0.1, 0.3, inn);
  const s = c.s * lerp(1.12, 1, grow);
  const phone = $("#phone");
  phone.style.display = t < T.toPhone || leaving >= 1 ? "none" : "";
  phone.style.transform = `translate(${n(c.cx - c.fx * 780 * s - 900 * leaving)}px, ${n(c.ty - c.fy * 1696 * s)}px) scale(${n(s)})`;
  phone.style.opacity = grow * (1 - leaving);
  $("#shade").style.opacity = t < T.toPhone ? 0 : 1 - prog(t, T.cal3d - 0.1, 0.3);
  const push = prog(t, T.toChat, 0.34); // Today → Coach: a sideways push inside the phone
  $("#s-today").style.transform = `translateX(${-780 * push}px)`;
  $("#s-chat").style.transform = `translateX(${780 * (1 - push)}px)`;
  let f = { box: [...FOCUS[0].box], dim: FOCUS[0].dim };
  for (const key of FOCUS.slice(1)) {
    if (t <= key.at) break;
    const q = prog(t, key.at, key.dur), box = key.box ?? f.box;
    f = { box: f.dim < 0.01 ? [...box] : f.box.map((v, i) => lerp(v, box[i], q)), dim: lerp(f.dim, key.dim, q) };
  }
  Object.assign($("#focus").style, { left: f.box[0] * 780 + "px", top: f.box[1] * 1696 + "px", width: (f.box[2] - f.box[0]) * 780 + "px", height: (f.box[3] - f.box[1]) * 1696 + "px", boxShadow: `0 0 0 4000px rgba(0, 0, 0, ${f.dim.toFixed(3)})` });

  // Captions. The first is on screen from the first frame.
  document.querySelectorAll(".cap").forEach((cap, i) => {
    const [from, to] = T.captions[i];
    const enter = i === 0 ? 1 : prog(t, from, 0.24, out), exit = prog(t, to, 0.18);
    cap.style.opacity = enter * (1 - exit);
    cap.style.transform = i === 0 ? `scale(${n(lerp(1.08, 1, prog(t, 0, 0.6, out)))}) translateY(${-exit * 14}px)` : `translateY(${n((1 - enter) * 22 - exit * 14)}px)`;
  });

  // End card
  const end = $("#end");
  end.style.display = t < T.end - 0.02 ? "none" : "";
  [["#lockup", 0, 0.3], ["#dev", 0.08, 0.3], ["#join", 0.14, 0.35], ["#site", 0.2, 0.35]].forEach(([id, delay, dur]) => {
    const e = prog(t, T.end + delay, dur, out);
    $(id).style.opacity = e;
    $(id).style.transform = `translateY(${(1 - e) * 24}px)`;
  });
}

const U = 132 / 48; // the Slot tile: a 48 × 48 unit grid (brand/README.md), dark version
[[9, 9, 22, 7, "#48484A"], [17, 19, 22, 10, "#fff"], [9, 32, 22, 7, "#48484A"]].forEach(([x, y, w, h, color], i) => {
  Object.assign(document.querySelectorAll("#tile div")[i].style, { left: x * U + "px", top: y * U + "px", width: w * U + "px", height: h * U + "px", borderRadius: 2.5 * U + "px", background: color });
});
const timing = new URLSearchParams(location.search).get("timing") ?? "story3"; // which take's timing to follow
Promise.all([fetch(`out/${timing}.json`).then((r) => r.json()).then(plan), document.fonts.load('800 100px "Onest"', "habitnex"), ...[...document.images].map((img) => img.decode())]).then(() => {
  window.TIMES = T;
  window.seek = seek;
  seek(Number(new URLSearchParams(location.search).get("t") ?? 0));
  window.READY = true;
});
</script>
